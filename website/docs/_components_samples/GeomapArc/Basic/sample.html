<!-- playground-fold -->
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sample</title>
</head>

<body style="background-color: var(--sapBackgroundColor); height: 300px;">
	<header>
		<ui5-button id="startAnimation">Fly from New York to Paris</ui5-button>
		<ui5-label>Animation frames:</ui5-label>
		<ui5-input id="totalFrames" value="500"></ui5-input>
		<ui5-label>Travelled:</ui5-label>
		<ui5-input id="display" value="" readonly></ui5-input>
	</header>
	<!-- playground-fold-end -->
	<ui5-geomap
		id="map"
		center-lat="39.726271610784835"
		center-lng="-34.429825568362276"
		zoom="2"
	>
		<!-- controls -->
		<ui5-geomap-navigation-control></ui5-geomap-navigation-control>

		<!-- data provider-->
		<ui5-geomap-provider
			style-url="https://demotiles.maplibre.org/style.json"
		></ui5-geomap-provider>

		<ui5-geomap-arc id="arc" begin-lng="-73.98270540162157" begin-lat="40.72607712159058" end-lng="2.3415010101080327" end-lat="48.85653689004303" steps="100" color="blue" width="2"></ui5-geomap-arc>

		<ui5-geomap-container id="plane" lng="-73.98270540162157" lat="40.72607712159058">
			<ui5-icon name="flight" style="transform: rotate(65deg);"></ui5-icon>
		</ui5-geomap-container>

		<ui5-geomap-circle id="plane" lng="-73.98270540162157" lat="40.72607712159058" radius="5" fill-color="blue" outline-color="white" outline-width="2"></ui5-geomap-circle>

	</ui5-geomap>
	<!-- playground-fold -->
<script type="module" src="main.js"></script>
</body>

</html>
<!-- playground-fold-end -->
