<!-- playground-fold -->
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sample</title>
</head>

<body style="background-color: var(--sapBackgroundColor); height: 300px;">
	<!-- playground-fold-end -->
	<ui5-geomap
		id="myMap"
		center-lat="50.1109"
		center-lng="11.0767"
		zoom="6"
	>

		<!-- data provider-->
		<ui5-geomap-provider
			slot="mapControls"
			style-url="https://demotiles.maplibre.org/style.json"
		></ui5-geomap-provider>

		<ui5-geomap-line class="clickable-layer" color="green" width="7" opacity="0.3">
			<ui5-geomap-point lng="8.6821" lat="50.1109"></ui5-geomap-point>
			<ui5-geomap-point lng="11.0767" lat="49.4521"></ui5-geomap-point>
			<ui5-geomap-point lng="10.90067" lat="49.89873"></ui5-geomap-point>
			<ui5-geomap-point lng="11.578783087434374" lat="49.935896203951074"></ui5-geomap-point>
		</ui5-geomap-line>

	</ui5-geomap>
	<!-- playground-fold -->

	<ui5-popover id="info">
		<ui5-list>
			<ui5-li>Option 1</ui5-li>
			<ui5-li>Option 2</ui5-li>
			<ui5-li>Option 3</ui5-li>
			<ui5-li>Option 4</ui5-li>
		</ui5-list>
	</ui5-popover>

	<script type="module" src="main.js"></script>
</body>

</html>
<!-- playground-fold-end -->
