<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sample</title>
</head>

<body style="background-color: var(--sapBackgroundColor); height: 300px;">
	<!-- playground-fold-end -->
	<ui5-geomap
		id="map"
		center-lat="39.726271610784835"
		center-lng="-34.429825568362276"
		zoom="2"
	>
		<!-- controls -->
		<ui5-geomap-fullscreen-control slot="mapControls"></ui5-geomap-fullscreen-control>

		<!-- data provider-->
		<ui5-geomap-provider
			slot="mapControls"
			style-url="https://demotiles.maplibre.org/style.json"
		></ui5-geomap-provider>

	</ui5-geomap>
	<!-- playground-fold -->
	<script type="module" src="main.js"></script>
</body>

</html>
<!-- playground-fold-end -->
