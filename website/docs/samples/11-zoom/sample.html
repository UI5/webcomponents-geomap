<!-- playground-fold -->
<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<script data-ui5-config type="application/json">
			{
				"language": "EN"
			}
		</script>

		<script src="./main.js" type="module"></script>

		<style>
			#map {
				margin-top: 10px;
				width: 100%;
				height: 700px;
			}
		</style>
	</head>

	<body>
		<ui5-title>Show different layers based on the zoom level of the map</ui5-title>
		<ui5-label>Start zooming out the map and observe the layers change</ui5-label>
		<br><br>

<!-- playground-fold-end -->
		<ui5-geomap
			id="map"
			center-lat="49.15390360888017"
			center-lng="6.305814829020733"
			zoom="11"
		>
			<!-- controls -->
			<ui5-geomap-navigation-control slot="mapControls"></ui5-geomap-navigation-control>

			<!-- data provider-->
			<ui5-geomap-provider
				slot="mapControls"
				style-url="https://demotiles.maplibre.org/style.json"
			></ui5-geomap-provider>

			<ui5-geomap-source id="data1"></ui5-geomap-source>
			<ui5-geomap-source id="data2"></ui5-geomap-source>
			<ui5-geomap-source id="data3"></ui5-geomap-source>

			<ui5-geomap-circle-layer min-zoom="9" source="data1"  radius="20" fill-color="green" opacity="0.5"></ui5-geomap-circle-layer>
			<ui5-geomap-circle-layer min-zoom="6" max-zoom="9" source="data2" radius="30" fill-color="yellow" opacity="0.5"></ui5-geomap-circle-layer>
			<ui5-geomap-circle-layer max-zoom="6" source="data3" radius="40" fill-color="red" opacity="0.5"></ui5-geomap-circle-layer>

		</ui5-geomap>
<!-- playground-fold -->

	</body>
</html>
<!-- playground-fold -->
