<!-- playground-fold -->
<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<script data-ui5-config type="application/json">
			{
				"language": "EN"
			}
		</script>
		<script src="./main.js" type="module"></script>

		<style>
			#map {
				margin-top: 10px;
				width: 100%;
				height: 700px;
			}

			header {
				display: flex;
				align-items: center;
			}

			header > * {
				margin: 0 10px 0 0;
			}
		</style>
	</head>

	<body>
		<ui5-title
			>Click the Start animation button to test animating a cirle over a
			flight path</ui5-title
		>
		<ui5-label
			>You can select how many frames the animation will run by changing
			the input and re-playing the animation</ui5-label
		>
		<br />
		<br />

		<header>
			<ui5-button id="startAnimation"
				>Fly from New York to Paris</ui5-button
			>
			<ui5-label>Animation frames:</ui5-label>
			<ui5-input id="totalFrames" value="500"></ui5-input>
			<ui5-label>Travelled:</ui5-label>
			<ui5-input id="display" value="" readonly></ui5-input>
		</header>
<!-- playground-fold-end -->
		<ui5-geomap
			id="map"
			center-lat="39.726271610784835"
			center-lng="-34.429825568362276"
			zoom="3"
		>
			<!-- controls -->
			<ui5-geomap-navigation-control slot="mapControls"></ui5-geomap-navigation-control>

			<!-- data provider-->
			<ui5-geomap-provider
				slot="mapControls"
				style-url="https://demotiles.maplibre.org/style.json"
			></ui5-geomap-provider>

			<ui5-geomap-arc
				id="arc"
				begin-lng="-73.98270540162157"
				begin-lat="40.72607712159058"
				end-lng="2.3415010101080327"
				end-lat="48.85653689004303"
				steps="100"
				color="blue"
				width="2"
			></ui5-geomap-arc>

			<ui5-geomap-container
				id="plane"
				lng="-73.98270540162157"
				lat="40.72607712159058"
			>
				<ui5-icon
					name="flight"
					style="transform: rotate(65deg)"
				></ui5-icon>
			</ui5-geomap-container>

			<ui5-geomap-circle
				id="plane"
				lng="-73.98270540162157"
				lat="40.72607712159058"
				radius="5"
				fill-color="blue"
				outline-color="white"
				outline-width="2"
			></ui5-geomap-circle>
		</ui5-geomap>
<!-- playground-fold -->
	</body>
</html>
<!-- playground-fold-end -->
