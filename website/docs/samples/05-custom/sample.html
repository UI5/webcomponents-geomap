<!-- playground-fold -->
<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<script data-ui5-config type="application/json">
			{
				"language": "EN"
			}
		</script>

		<script src="./main.js" type="module"></script>

		<style>
			#map {
				margin-top: 10px;
				width: 100%;
				height: 700px;
			}

			#search {
				position: absolute;
				z-index: 100;
				top: 2px;
				right: 2px;
				width: 400px;
			}
		</style>
	</head>

	<body>
		<ui5-title
			>Custom layers used to display GeoJSON data directly</ui5-title
		>
		<ui5-label>Use the search to filter states, click on a state</ui5-label>
		<br />
		<br />

		<div style="position: relative">
<!-- playground-fold-end -->
			<ui5-geomap
				id="map"
				center-lng="-87.7292790540713"
				center-lat="36.79873532444539"
				zoom="3"
			>
				<!-- controls -->
				<ui5-geomap-navigation-control slot="mapControls"></ui5-geomap-navigation-control>

				<!-- data provider-->
				<ui5-geomap-provider
					slot="mapControls"
					style-url="https://demotiles.maplibre.org/style.json"
				></ui5-geomap-provider>
			</ui5-geomap>
<!-- playground-fold -->
			<ui5-input
				id="search"
				placeholder="Start typing to filter states..."
				show-suggestions
				highlight
			>
				<ui5-icon slot="icon" name="search"></ui5-icon>
			</ui5-input>
		</div>

		<ui5-popover id="info">
			<ui5-label>This is: </ui5-label>
			<ui5-title class="description"></ui5-title>
			<ui5-button id="fly">Zoom in</ui5-button>
		</ui5-popover>
	</body>
</html>
<!-- playground-fold -->
