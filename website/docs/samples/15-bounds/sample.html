<!-- playground-fold -->
<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8" />

		<script data-ui5-config type="application/json">
			{
				"language": "EN"
			}
		</script>

		<script src="./main.js" type="module"></script>

		<style>
			#map {
				margin-top: 10px;
				width: 100%;
				height: 700px;
			}
		</style>
	</head>

	<body>

		<ui5-title>Query the boundaries of the map</ui5-title>
		<ui5-label>Fetch data from the server, based on the boundaries of the map (visible area/viewport)</ui5-label>
		<br><br>
		<!-- playground-fold-end -->
		<ui5-geomap
			id="map"
			center-lat="49.3988"
			center-lng="8.6724"
			zoom="3"
		>
			<!-- controls -->
			<ui5-geomap-navigation-control slot="mapControls"></ui5-geomap-navigation-control>
			<ui5-geomap-scale-control slot="mapControls" position="BottomRight"></ui5-geomap-scale-control>

			<!-- data provider-->
			<ui5-geomap-provider
				slot="mapControls"
				style-url="https://demotiles.maplibre.org/style.json"
			></ui5-geomap-provider>

			<ui5-geomap-source id="objects"></ui5-geomap-source>
			<ui5-geomap-circle-layer source="objects" fill-color="green" radius="30" opacity="0.5"></ui5-geomap-circle-layer>
			<ui5-geomap-symbol-layer id="labels" text-size="12" source="objects"></ui5-geomap-symbol-layer>
		</ui5-geomap>
		<!-- playground-fold -->
	</body>
</html>
<!-- playground-fold -->
