<!DOCTYPE html>
<html>

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<script data-ui5-config type="application/json">
		{
			"language": "EN"
		}
	</script>

	<script src="../../../bundle.esm.js" type="module"></script>
	<script src="./main.js" type="module"></script>

	<style>
		#map {
			margin-top: 10px;
			width: 100%;
			height: 500px;
		}
		header {
			background: #fafafa;
			position: sticky;
			top: 0;
			width: 100%;
			z-index: 10;
			padding: 8px 12px;
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}
		#preview-section {
			padding: 16px 12px;
		}
		#preview-section ui5-title {
			display: block;
			margin-bottom: 8px;
		}
		#preview {
			max-width: 100%;
			border: 1px solid #ccc;
			border-radius: 4px;
			display: block;
			margin-bottom: 8px;
		}
	</style>
</head>

<body>

<header>
	<ui5-title>Screenshot API</ui5-title>
	<ui5-button id="btnScreenshot" icon="camera">Take Screenshot</ui5-button>
	<ui5-link id="download" hidden download="map-screenshot.png">Download PNG</ui5-link>
</header>

<ui5-geomap
	id="map"
	center-lat="49.3988"
	center-lng="8.6724"
	zoom="7.5"
>
	<ui5-geomap-navigation-control></ui5-geomap-navigation-control>
	<ui5-geomap-scale-control position="BottomLeft"></ui5-geomap-scale-control>

	<ui5-geomap-provider
		slot="mapControls"
		style-url="https://demotiles.maplibre.org/style.json"
	></ui5-geomap-provider>

	<ui5-geomap-spot lat="49.4" lng="8.5" icon="map-fill" color="red"></ui5-geomap-spot>
	<ui5-geomap-spot lat="48.1351" lng="11.5820" icon="map-fill" color="blue"></ui5-geomap-spot>
	<ui5-geomap-spot lat="50.9333" lng="6.9500" icon="map-fill" color="green"></ui5-geomap-spot>

	<ui5-geomap-polygon fill-color="orange" opacity="0.5">
		<ui5-geomap-point lng="6.1757" lat="49.1193"></ui5-geomap-point>
		<ui5-geomap-point lng="6.1844" lat="48.6921"></ui5-geomap-point>
		<ui5-geomap-point lng="7.7521" lat="48.5734"></ui5-geomap-point>
	</ui5-geomap-polygon>

	<ui5-geomap-line color="steelblue" width="5" opacity="0.8">
		<ui5-geomap-point lng="8.6821" lat="50.1109"></ui5-geomap-point>
		<ui5-geomap-point lng="11.0767" lat="49.4521"></ui5-geomap-point>
		<ui5-geomap-point lng="11.5820" lat="48.1351"></ui5-geomap-point>
	</ui5-geomap-line>
</ui5-geomap>

<div id="preview-section" hidden>
	<ui5-title level="H4">Screenshot Preview</ui5-title>
	<img id="preview" alt="Map screenshot preview">
</div>

</body>
</html>
