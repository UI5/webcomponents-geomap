<!DOCTYPE html>
<html>

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="utf-8">

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="utf-8">

	<script data-ui5-config type="application/json">
		{
			"language": "EN"
		}
	</script>

	<script src="../../../bundle.esm.js" type="module"></script>
	<script src="./main.js" type="module"></script>

	<style>
		#map {
			margin-top: 10px;
			width: 100%;
			height: 700px;
		}
	</style>
</head>

<body>

	<ui5-title>Dynamic data</ui5-title>
	<ui5-label>Simulation of often-changing data</ui5-label>
	<br><br>

	<ui5-geomap
		id="map"
		center-lng="-118.75757337396215"
		center-lat="47.2538497518260"
		zoom="3"
	>
		<!-- controls -->
		<ui5-geomap-navigation-control slot="mapControls"></ui5-geomap-navigation-control>

		<!-- data provider-->
		<ui5-geomap-provider
			slot="mapControls"
			style-url="https://demotiles.maplibre.org/style.json"
		></ui5-geomap-provider>

		<ui5-geomap-source id="data"></ui5-geomap-source>
		<ui5-geomap-circle-layer id="layer" source="data" opacity="0.5"></ui5-geomap-circle-layer>
		<ui5-geomap-symbol-layer id="labels" text-size="8" source="data"></ui5-geomap-symbol-layer>

	</ui5-geomap>
</body>

</html>
