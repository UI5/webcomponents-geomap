<!DOCTYPE html>
<html>

	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta charset="utf-8">

		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta charset="utf-8">

		<script data-ui5-config type="application/json">
			{
				"language": "EN"
			}
		</script>
		<script src="../../../bundle.esm.js" type="module"></script>
		<script src="./main.js" type="module"></script>

		<style>
			#map {
				margin-top: 10px;
				width: 100%;
				height: 700px;
			}

		</style>
	</head>

	<body>

		<ui5-title>Centers and zooms the map where the user is located</ui5-title>
		<ui5-label>The user must allow the browser to get their location</ui5-label>
		<br>
		<br>

		<ui5-geomap
			id="map"
			center-lng="0"
			center-lat="0"
			zoom="1"
		>
			<!-- controls -->
			<ui5-geomap-navigation-control slot="mapControls"></ui5-geomap-navigation-control>

			<!-- data provider-->
			<ui5-geomap-provider
					slot="mapControls"
					style-url="https://demotiles.maplibre.org/style.json"
			></ui5-geomap-provider>

		</ui5-geomap>

		<ui5-toast id="toast" placement="MiddleCenter">Could not get user location</ui5-toast>

	</body>

</html>
